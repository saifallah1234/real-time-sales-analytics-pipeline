# Debezium Server 3.7: RDS Postgres -> one Kinesis stream (cdc_events).
# DB_HOST / DB_PASSWORD come from environment variables (Quarkus ${...} expansion); never commit real values.
# 3.7 ships the SMTs outside lib/: copy connectors/debezium-connector-dse/debezium-connect-plugins-*.jar into lib/.

# --- sink: Kinesis (credentials come from the EC2 instance role) ---
debezium.sink.type=kinesis
debezium.sink.kinesis.region=eu-central-1

# --- source: RDS Postgres ---
debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
debezium.source.database.hostname=${DB_HOST}
debezium.source.database.port=5432
debezium.source.database.user=saif
debezium.source.database.password=${DB_PASSWORD}
debezium.source.database.dbname=cdc_project
debezium.source.topic.prefix=cdc
debezium.source.plugin.name=pgoutput
debezium.source.slot.name=debezium_slot
# Created by postgres beforehand: saif doesn't own the tables.
debezium.source.publication.name=dbz_publication
debezium.source.publication.autocreate.mode=disabled
debezium.source.schema.include.list=cdc_schema
debezium.source.offset.storage.file.filename=data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
# Money as "123.45" strings instead of base64 bytes (Redshift can't read those).
debezium.source.decimal.handling.mode=string
debezium.source.tombstones.on.delete=false

# --- format + routing: flat rows + __op/__table/__lsn/__source_ts_ms/__deleted, all tables -> cdc_events ---
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key.schemas.enable=false
debezium.transforms=unwrap,route
debezium.transforms.unwrap.type=io.debezium.transforms.ExtractNewRecordState
debezium.transforms.unwrap.add.fields=op,table,lsn,source.ts_ms
debezium.transforms.unwrap.delete.tombstone.handling.mode=rewrite
debezium.transforms.route.type=io.debezium.transforms.ByLogicalTableRouter
debezium.transforms.route.topic.regex=.*
debezium.transforms.route.topic.replacement=cdc_events

# --- logs ---
quarkus.log.console.json=false
