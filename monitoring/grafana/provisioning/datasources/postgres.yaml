apiVersion: 1

datasources:
  - name: CDC Postgres
    uid: cdc-postgres
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: cdc_project
      sslmode: disable
      postgresVersion: 1500
      timescaledb: false
    secureJsonData:
      password: grafana_reader
